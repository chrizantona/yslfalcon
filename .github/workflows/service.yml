name: Service

on:
  push:
    paths: ["service/**", ".github/workflows/service.yml"]
  pull_request:
    paths: ["service/**", ".github/workflows/service.yml"]

permissions:
  contents: read

concurrency:
  group: service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: service/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check backend tests scripts
      - run: ruff format --check backend tests scripts
      - run: python -m pytest
      - run: pip-audit -r requirements.lock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: service/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run format:check
      - run: npm audit --audit-level=high

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.lock
      - run: python scripts/init_env.py
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait
      - run: python scripts/smoke.py
      - run: python scripts/smoke_gallery.py
      - if: always()
        run: docker compose down --volumes
