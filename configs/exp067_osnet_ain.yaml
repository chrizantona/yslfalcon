exp_id: EXP-067
parent: EXP-054
description: ImageNet OSNet-AIN x1.0 + GeM + 512D projection; EXP-054 training recipe
seeds: [0, 1, 2]
model:
  backbone: osnet_ain
  name: osnet_ain
  input_hw: [224, 224]
  appearance:
    weights: osnet/osnet_ain_x1_0_imagenet.pth
    sha256: b8a578eacc122c16496c8835c96a0157db62963b3de05b5a5a4b1ff5bad7546a
    dim: 512
    pooling: gem
    gem_p: 3.0
train:
  id_head: {type: arcface, scale: 30.0, margin: 0.5, imprinting: true, imprint_batch_size: 128}
  folds: [1, 2, 3]          # fold 0 = dev evaluation, fold 4 = untouched holdout
  vehicles_per_batch: 32    # P
  images_per_vehicle: 4     # K
  epochs: 30                # one epoch = every training vehicle once
  warmup_epochs: 10
  lr_backbone: 1.0e-5
  lr_head: 5.0e-4
  weight_decay: 1.0e-4
  label_smoothing: 0.1
  metric_loss: {type: supcon, temperature: 0.07}  # changed: batch-hard triplet (margin 0.3) -> SupCon
  flip_p: 0.5
  pad: 10
  erasing_p: 0.5
  num_workers: 12
  eval_every: 20
embed:
  batch_size: 256
  num_workers: 8
eval_fold: 0
refusal:
  max_candidates: 10
  min_tnr: 0.5
  threshold: null
benchmark:
  precision: fp16
