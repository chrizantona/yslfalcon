description: EXP-054 unchanged (frozen SigLIP 2 trunk, MAP pooling and BNNeck) plus a local branch - 4 learnable soft masks over the patch tokens, shared projection to 256, ArcFace with imprinting + SupCon; embedding concat(sqrt(1 - a) g, sqrt(a) l)
seeds: [0, 1, 2]
checkpoint_name: bcc3c7b4a6da439a82925695df53b80a_seed{seed}.pt  # the local head only; the base is the EXP-054 soup
model:
  backbone: clip
  name: ViT-SO400M-14-SigLIP2
