exp_id: EXP-077
parent: EXP-040
description: reference pretraining - EXP-040 (SigLIP 2 So400m/14 on VERI-Wild test) with the fine-tuning head and loss of EXP-053 (ArcFace with imprinting and SupCon) instead of the linear head and triplet
seeds: [0]
checkpoint_name: 53b74390daf24d159ad6a628742be673.pt  # random name fixed in advance: EXP-078 starts from it
model:
  backbone: clip
  name: ViT-SO400M-14-SigLIP2
  pretrained: webli
  weights: clip/siglip2_so400m14_webli.safetensors
  sha256: bd5884118e72b5cc24c37cff23b8d202e2c3dac723b8a150901b022785235626
  input_hw: [224, 224]
train:
  source: veriwild_test     # none of our images are used
  id_head: {type: arcface, scale: 30.0, margin: 0.5, imprinting: true, imprint_batch_size: 128}  # changed: linear -> ArcFace with imprinting
  vehicles_per_batch: 32    # P
  images_per_vehicle: 4     # K
  epochs: 30                # one epoch = every training vehicle once (~312 steps)
  warmup_epochs: 10
  lr_backbone: 1.0e-5
  lr_head: 5.0e-4
  weight_decay: 1.0e-4
  label_smoothing: 0.1
  metric_loss: {type: supcon, temperature: 0.07}  # changed: batch-hard triplet -> SupCon
  flip_p: 0.5
  pad: 10
  erasing_p: 0.5
  num_workers: 12
  eval_every: 10
embed:
  batch_size: 256
  num_workers: 8
eval_fold: 0
refusal:
  max_candidates: 10
  min_tnr: 0.5
  threshold: null
benchmark:
  precision: fp32
