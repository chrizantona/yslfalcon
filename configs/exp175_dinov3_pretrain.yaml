exp_id: EXP-175
parent: EXP-173
description: reference pretraining stage for DINOv3 ViT-L/16 on VERI-Wild test, the exact mirror of EXP-040 for SigLIP 2 - the stage EXP-173 did not have
seeds: [0]
checkpoint_name: 5e6d0aa0fd06769d6d162fbf5f1db90d.pt   # random name fixed in advance: EXP-176 starts from it
model:
  backbone: timm
  name: vit_large_patch16_dinov3.lvd1689m
  input_hw: [224, 224]
train:
  source: veriwild_test     # changed: folds 1-3 -> external set; none of our images are used
  id_head: {type: arcface, scale: 30.0, margin: 0.5, imprinting: true, imprint_batch_size: 128}
  vehicles_per_batch: 32    # P
  images_per_vehicle: 4     # K
  epochs: 30                # one epoch = every training vehicle once (~312 steps, 11x more than on our folds)
  warmup_epochs: 10
  lr_backbone: 1.0e-5
  lr_head: 5.0e-4
  weight_decay: 1.0e-4
  label_smoothing: 0.1
  metric_loss: {type: supcon+triplet, temperature: 0.1}
  triplet_margin: 0.3
  flip_p: 0.5
  pad: 10
  erasing_p: 0.5
  num_workers: 12
  eval_every: 10
embed:
  batch_size: 256
  num_workers: 8
eval_fold: 0
refusal:
  max_candidates: 10
  min_tnr: 0.5
  threshold: null
