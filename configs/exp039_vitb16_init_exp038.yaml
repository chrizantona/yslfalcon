exp_id: EXP-039
parent: EXP-010
description: EXP-010 with the backbone initialised from the EXP-038 pretraining (VERI-Wild test + VehicleID) instead of EXP-009
seeds: [0, 1, 2]
model:
  backbone: clip
  name: ViT-B-16
  pretrained: laion2b_s34b_b88k
  input_hw: [224, 224]
  init_checkpoint: 06ed25e8b8f7444dbbc08ea455ffd7fd.pt  # changed: EXP-038 instead of EXP-009 (61f971e21df349f8b0a3ff50d37aae97.pt)
train:
  folds: [1, 2, 3]          # fold 0 = dev evaluation, fold 4 = untouched holdout
  vehicles_per_batch: 32    # P
  images_per_vehicle: 4     # K
  epochs: 30                # one epoch = every training vehicle once
  warmup_epochs: 10
  lr_backbone: 1.0e-5
  lr_head: 5.0e-4
  weight_decay: 1.0e-4
  label_smoothing: 0.1
  triplet_margin: 0.3
  flip_p: 0.5
  pad: 10
  erasing_p: 0.5
  num_workers: 12
  eval_every: 20
embed:
  batch_size: 256
  num_workers: 8
eval_fold: 0
refusal:
  max_candidates: 10
  min_tnr: 0.5
  threshold: null
