exp_id: EXP-008
parent: EXP-003
description: EXP-003 with a CosFace (additive cosine margin) cosine classifier instead of the linear ID classifier
seeds: [0, 1, 2]
model:
  backbone: clip
  name: ViT-B-16
  pretrained: laion2b_s34b_b88k
  input_hw: [224, 224]
train:
  folds: [1, 2, 3]          # fold 0 = dev evaluation, fold 4 = untouched holdout
  vehicles_per_batch: 32    # P
  images_per_vehicle: 4     # K
  epochs: 30                # one epoch = every training vehicle once
  warmup_epochs: 10
  lr_backbone: 1.0e-5
  lr_head: 5.0e-4
  weight_decay: 1.0e-4
  id_head:                  # changed: linear classifier -> cosface; m from the paper, s = 30 (well above the bound of ~9 for ~925 classes), not tuned
    type: cosface
    scale: 30.0
    margin: 0.35
  label_smoothing: 0.1
  triplet_margin: 0.3
  flip_p: 0.5
  pad: 10
  erasing_p: 0.5
  num_workers: 12
  eval_every: 20
embed:
  batch_size: 256
  num_workers: 8
eval_fold: 0
refusal:
  max_candidates: 10
  min_tnr: 0.5
  threshold: null
