exp_id: EXP-009
parent: EXP-003
description: pretraining stage - the EXP-003 recipe trained on VERI-Wild test (10,000 vehicles) instead of our folds; fold 0 is scored without fine-tuning
seeds: [0]                # one pretraining run; the fine-tuning experiment on top of it uses 3 seeds
model:
  backbone: clip
  name: ViT-B-16
  pretrained: laion2b_s34b_b88k
  input_hw: [224, 224]
train:
  source: veriwild_test     # changed: folds 1-3 -> external set from data.yaml; none of our images are used
  vehicles_per_batch: 32    # P
  images_per_vehicle: 4     # K
  epochs: 30                # one epoch = every training vehicle once (~312 steps here)
  warmup_epochs: 10
  lr_backbone: 1.0e-5
  lr_head: 5.0e-4
  weight_decay: 1.0e-4
  label_smoothing: 0.1
  triplet_margin: 0.3
  flip_p: 0.5
  pad: 10
  erasing_p: 0.5
  num_workers: 12
  eval_every: 10            # fold 0 without fine-tuning, a transfer curve only; the epoch is not chosen by it
embed:
  batch_size: 256
  num_workers: 8
eval_fold: 0
refusal:
  max_candidates: 10
  min_tnr: 0.5
  threshold: null
