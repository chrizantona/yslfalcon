# Pod layout: only the dataset lives on the pod.
dataset_dir: /dev/shm/lct2026/dataset   # images/, train.csv, test_query.csv, test_gallery.csv
crops_dir: /dev/shm/lct2026/crops512    # training crops written by reid.crops
masked_crops_dir: /dev/shm/lct2026/crops512_sam   # the same crops from the SAM-masked frames (configs/data_sam.yaml)
masks_dir: /dev/shm/lct2026/masks512    # vehicle masks of the training crops, from the two above (reid.background)
backgrounds_dir: /dev/shm/lct2026/backgrounds  # random windows of training-fold frames (reid.background)
crop_max_side: 512                      # longer side of a crop, px; smaller crops are not upscaled
crop_jpeg_quality: 95
checkpoint_dir: /workspace/checkpoints  # trained weights stay on the pod; file names are random and recorded in git
external_weights_dir: /workspace/ext_data/weights  # public ReID checkpoints (reid.teachers), licences next to the files
external:                               # pretraining sets: archive on /workspace, unpacked copy by reid.external in /dev/shm
  veriwild_test:                        # VERI-Wild large test split (10,000 vehicles), Kaggle mirror mrkdagods/veriwild-test
    archive: /workspace/ext_data/kaggle/veriwild_test.zip
    dir: /dev/shm/ext/veriwild_test
  veri776:                              # VeRi-776 train + test (776 vehicles), Kaggle mirror abhyudaya12/veri-vehicle-re-identification-dataset
    archive: /workspace/ext_data/kaggle/veri776.zip
    dir: /dev/shm/ext/veri776
  vehicleid:                            # VehicleID (PKU, on request); encrypted, unpacked beforehand by scripts/prepare_vehicleid.sh
    archive: /workspace/ext_data/vehicleid/VehicleID_V1.0.zip
    dir: /dev/shm/ext/vehicleid
  vehicleid_train:                      # official train split only; required for every new VehicleID experiment
    archive: /workspace/ext_data/vehicleid/VehicleID_V1.0.zip
    dir: /workspace/ext_data/vehicleid/official_train  # persistent subset; do not duplicate 3.7 GiB in RAM
    kind: vehicleid_train
    table: train_official.csv
    expected_images: 113346
    expected_vehicles: 13164
