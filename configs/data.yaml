# Layout of the GPU machine the model was trained on; the inference container uses configs/data_docker.yaml instead.
dataset_dir: /dev/shm/lct2026/dataset   # images/, train.csv, test_query.csv, test_gallery.csv
crops_dir: /dev/shm/lct2026/crops512    # training crops written by reid.crops
crop_max_side: 512                      # longer side of a crop, px; smaller crops are not upscaled
crop_jpeg_quality: 95
checkpoint_dir: /workspace/checkpoints  # every trained file; names are fixed in configs/train/*.yaml
external_weights_dir: /workspace/ext_data/weights  # public SigLIP 2 weights (scripts/fetch_training_data.sh)
external:                               # the pretraining set: archive on /workspace, unpacked copy by reid.external
  veriwild_test:                        # VERI-Wild large test split (10,000 vehicles), Kaggle mirror mrkdagods/veriwild-test
    archive: /workspace/ext_data/kaggle/veriwild_test.zip
    dir: /dev/shm/ext/veriwild_test
