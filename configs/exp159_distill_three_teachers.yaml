exp_id: EXP-159
parent: EXP-154
description: EXP-154 with the stronger teacher found in EXP-158 - the three-model ensemble (EXP-090, EXP-121 seed 0, EXP-152 seed 0 at 384) instead of two models; same unlabelled VERI-Wild stream
seeds: [0, 1, 2]
checkpoint_name: cf0ffbd2257f4b1c95657999235aeefc_seed{seed}.pt
model:
  backbone: clip
  name: ViT-SO400M-14-SigLIP2
  pretrained: webli
  weights: clip/siglip2_so400m14_webli.safetensors
  sha256: bd5884118e72b5cc24c37cff23b8d202e2c3dac723b8a150901b022785235626
  init_checkpoint: b155ab652c084d75bf3054d188e01313.pt
  input_hw: [224, 224]
train:
  id_head: {type: arcface, scale: 30.0, margin: 0.5, imprinting: true, imprint_batch_size: 128}
  folds: [1, 2, 3]          # fold 0 = dev evaluation, fold 4 = untouched holdout
  vehicles_per_batch: 32    # P
  images_per_vehicle: 4     # K
  epochs: 30                # one epoch = every training vehicle once
  warmup_epochs: 10
  lr_backbone: 1.0e-5
  lr_head: 5.0e-4
  weight_decay: 1.0e-4
  label_smoothing: 0.1
  metric_loss: {type: supcon+triplet, temperature: 0.1}
  distill:                  # added: KL between the batch similarity matrices of teacher and student
    teachers:
      - {config: configs/exp090_soup_exp089_seeds.yaml, checkpoint: 73e50afa87f9459184d3e96cdca786d8.pt, sha256: 605aee3dc819ecfe7234d8602a2ec27a225c62f9fb53cf1f63ecfd8ad8cd64ae}
      - {config: configs/exp121_so400m16_chain.yaml, checkpoint: 991d4d3cdda14906a2711e3112959b83_seed0.pt}
      - {config: configs/exp152_so400m16_384_teacher.yaml, checkpoint: 6b2d18ae40c04f5f8f2a1c3d5e7b9a02_seed0.pt}
    weight: 1.0
    temperature: 0.1
    extra:                  # added: an unlabelled stream distilled next to every labelled batch
      source: veriwild_test
      batch_size: 128
  triplet_margin: 0.3
  flip_p: 0.5
  pad: 10
  erasing_p: 0.5
  num_workers: 12
  eval_every: 20
embed:
  batch_size: 256
  num_workers: 8
