exp_id: EXP-000
description: zero-shot CLIP ViT-B/16 image embeddings; checks the end-to-end submission pipeline, not a comparison baseline
model:
  name: ViT-B-16
  pretrained: laion2b_s34b_b88k
  input_hw: [224, 224]   # crops are squashed to this size
embed:
  batch_size: 256
  num_workers: 16
eval_fold: 0
refusal:
  max_candidates: 10
  min_tnr: 0.5           # threshold = best F1 among thresholds with TNR >= min_tnr
  threshold: 2.708       # calibrated on val_v1 fold 0 by reid.evaluate (EXP-000); null -> read artifacts/.../threshold.json
