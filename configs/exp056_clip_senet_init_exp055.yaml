exp_id: EXP-056
parent: EXP-055
description: CLIP-SENet from the VehicleID run EXP-055, trained on our folds 1-3 with the same recipe
seeds: [0, 1, 2]
model:
  arch: clip_senet          # reid.paper_models, trained by reid.train_paper
  backbone: paper
  name: clip_senet
  init_checkpoint: 136a8ea131cb4019a68605cbae11ae5f.pt  # EXP-055; everything but the classifier
  input_hw: [320, 320]
  embedding_dim: 2048       # T = T^u + T^s'
  afem_groups: 32
  appearance: {file: paper/resnext101_ibn_a-6ace051d.pth, sha256: 6ace051dc2d2de2aace20cc327d9f2f64892696eaf13d8b1bbf0accf45684ac8}
  semantic: {file: paper/tinyclip_vit61m_32_laion400m.safetensors, sha256: 0c0670dfa6fbf32c3158ef57b10772d5c9668093bda676d78e1452268585d230,
             patch: 32, width: 640, depth: 12, heads: 10, mlp: 2560, dim: 512}
train:
  folds: [1, 2, 3]          # fold 0 = dev evaluation, fold 4 = untouched holdout
  vehicles_per_batch: 16    # P
  images_per_vehicle: 8     # K: batch 128 as in the paper
  epochs: 120               # the paper's schedule; 924 vehicles -> 57 batches per epoch
  warmup_epochs: 10
  milestones: [40, 70]      # x0.1
  lr: 3.5e-4
  weight_decay: 5.0e-4
  label_smoothing: 0.1
  loss: {ce: 1.0, supcon: 1.0, temperature: 0.07}
  flip_p: 0.5
  pad: 10                   # random crop
  erasing_p: 0.5
  color_jitter: {p: 0.5, brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.05}
  num_workers: 12
  eval_every: 20
embed:
  batch_size: 256
  num_workers: 8
eval_fold: 0
refusal:
  max_candidates: 10
  min_tnr: 0.5
  threshold: null
benchmark:
  precision: fp32
