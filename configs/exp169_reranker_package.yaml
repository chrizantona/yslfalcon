exp_id: EXP-169
parent: EXP-168
description: package against the over-fitting of EXP-168 - VERI-Wild identities in pair training, hard negatives only, token augmentation, dropout, and fold 3 held out to validate the pairs
source_dir: artifacts/EXP-165/qe_k1_a3
checkpoint: 62b5cc1c7578e9f5430afb75351851dd.pt
model:
  backbone: clip
  name: ViT-SO400M-14-SigLIP2
  pretrained: webli
  weights: clip/siglip2_so400m14_webli.safetensors
  sha256: bd5884118e72b5cc24c37cff23b8d202e2c3dac723b8a150901b022785235626
  input_hw: [224, 224]
  drop_path_rate: 0.05
window: 20
width: 256
blocks: 2
heads: 4
dropout: 0.1                # added: the module of EXP-168 had none
weights: [0.0, 0.25, 0.5, 1.0]
train:
