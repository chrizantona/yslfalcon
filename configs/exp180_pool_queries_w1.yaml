exp_id: EXP-180
parent: EXP-161
description: EXP-161 with four queries in the tower's attention pooling instead of one (outputs averaged), each with its own offset after the q projection, and a penalty on the overlap of their attention maps; penalty weight 1
seeds: [0, 1, 2]
checkpoint_name: cec003d07cd230c4df7261135e29d020_seed{seed}.pt
model:
  backbone: clip
  name: ViT-SO400M-14-SigLIP2
  pretrained: webli
  weights: clip/siglip2_so400m14_webli.safetensors
  sha256: bd5884118e72b5cc24c37cff23b8d202e2c3dac723b8a150901b022785235626
  init_checkpoint: b155ab652c084d75bf3054d188e01313.pt
  input_hw: [224, 224]
  drop_path_rate: 0.05
  pool_queries: 4           # changed: 1 -> 4; averaged, so the embedding keeps its 1152 dims
  pool_offset_norm: 8.5     # each extra query starts this far from the pretrained one: the norm of its q bias (8.54)
train:
  id_head: {type: arcface, scale: 30.0, margin: 0.5, imprinting: true, imprint_batch_size: 128}
  folds: [1, 2, 3]          # fold 0 = dev evaluation, fold 4 = untouched holdout
  vehicles_per_batch: 32    # P
  images_per_vehicle: 4     # K
  epochs: 30                # one epoch = every training vehicle once
  warmup_epochs: 10
  lr_backbone: 1.0e-5
  lr_head: 5.0e-4
  weight_decay: 1.0e-4
  label_smoothing: 0.1
  metric_loss: {type: supcon+triplet, temperature: 0.1}
  triplet_margin: 0.3
  pool_diversity: 1         # weight of the mean cosine between the queries' attention maps
  flip_p: 0.5
  pad: 10
  erasing_p: 0.5
  num_workers: 12
  eval_every: 20
embed:
  batch_size: 256
  num_workers: 8
eval_fold: 0
refusal:
  max_candidates: 10
  min_tnr: 0.5
  threshold: null
benchmark:
  precision: fp32
