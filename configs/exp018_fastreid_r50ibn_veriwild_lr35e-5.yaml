exp_id: EXP-018
parent: EXP-017
description: EXP-017 with backbone lr 3.5e-5 instead of 3.5e-4: gentler fine-tuning that keeps more of the VERI-Wild features
seeds: [0, 1, 2]
model:                      # changed together: backbone, its VERI-Wild ReID weights, GeM pooling, input size
  backbone: fastreid_r50ibn
  weights: fast-reid/veriwild_bot_R50-ibn.pth   # FastReID BoT ResNet50-IBN, VERI-Wild train; relative to external_weights_dir
  input_hw: [256, 256]      # the size the checkpoint was trained with
train:
  folds: [1, 2, 3]          # fold 0 = dev evaluation, fold 4 = untouched holdout
  vehicles_per_batch: 32    # P
  images_per_vehicle: 4     # K
  epochs: 30                # one epoch = every training vehicle once
  warmup_epochs: 10
  lr_backbone: 3.5e-5       # changed: 3.5e-4 -> 3.5e-5
  lr_head: 5.0e-4
  weight_decay: 1.0e-4
  label_smoothing: 0.1
  triplet_margin: 0.3
  flip_p: 0.5
  pad: 10
  erasing_p: 0.5
  num_workers: 12
  eval_every: 20
embed:
  batch_size: 256
  num_workers: 8
eval_fold: 0
refusal:
  max_candidates: 10
  min_tnr: 0.5
  threshold: null
