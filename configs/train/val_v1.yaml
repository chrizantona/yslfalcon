# Frozen validation protocol. Never regenerate it: any change means a new version (val_v2).
version: val_v1
out_dir: protocol/val_v1
n_folds: 5
split_seed: 42        # vehicle -> fold assignment
pseudo_test_seed: 0   # which frame of each (vehicle, camera) goes to the gallery
no_match_frac: 0.3    # share of a fold's vehicles removed from its gallery to calibrate the refusal mode
no_match_seed: 0
dev_fold: 0           # used for experiments
holdout_fold: 4       # untouched until the final candidates
