exp_id: EXP-152
parent: EXP-089
description: the EXP-089 recipe on the SigLIP 2 So400m/16 tower at 384 px from its own pretraining EXP-151 - the distillation teacher; too slow to submit
seeds: [0]                # one seed: the teacher is measured, not souped
checkpoint_name: 6b2d18ae40c04f5f8f2a1c3d5e7b9a02_seed{seed}.pt
model:
  backbone: clip
  name: ViT-SO400M-16-SigLIP2-384  # changed with its pretraining: the 384 tower
  pretrained: webli
  weights: clip/siglip2_so400m16_384_webli.safetensors
  sha256: 8ceec00df3c462d155d172933339cd9178a86bfab72f4458dbe84bd54f5ad026
  init_checkpoint: 5f0a3c9b71f2470d9c1d2d8c4b6a7e13.pt  # changed: the EXP-151 pretraining of this tower
  input_hw: [384, 384]
train:
  id_head: {type: arcface, scale: 30.0, margin: 0.5, imprinting: true, imprint_batch_size: 128}
  folds: [1, 2, 3]          # fold 0 = dev evaluation, fold 4 = untouched holdout
  vehicles_per_batch: 32    # P
  images_per_vehicle: 4     # K
  epochs: 30                # one epoch = every training vehicle once
  warmup_epochs: 10
  lr_backbone: 1.0e-5
  lr_head: 5.0e-4
  weight_decay: 1.0e-4
  label_smoothing: 0.1
  metric_loss: {type: supcon+triplet, temperature: 0.1}
  triplet_margin: 0.3
  flip_p: 0.5
  pad: 10
  erasing_p: 0.5
  num_workers: 12
  eval_every: 20
embed:
  batch_size: 256
  num_workers: 8
eval_fold: 0
refusal:
  max_candidates: 10
  min_tnr: 0.5
  threshold: null
benchmark:
  precision: fp16
