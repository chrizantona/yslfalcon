# docker compose up --build  ->  artifacts/final/submission/. The build downloads the weights; the run has no network.
services:
  inference:
    platform: linux/amd64
    user: "${INFERENCE_UID:-1000}:${INFERENCE_GID:-1000}"
    build:
      context: .
    volumes:
      - ${DATASET_DIR:-./BIG_DATA/dataset}:/data:ro
      - ./artifacts:/app/artifacts
    command: ["${SUBMIT_CONFIG:-configs/final_model.yaml}"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${INFERENCE_GPU:-1}"]
              capabilities: [gpu]
