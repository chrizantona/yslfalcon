# DATASET_DIR=/path/to/dataset docker compose up --build  ->  submission/. The build downloads the weights; the run has
# no network. The container runs as root so it can write into submission/ whoever owns the checkout.
services:
  inference:
    platform: linux/amd64
    user: root
    build:
      context: .
    volumes:
      - ${DATASET_DIR:-./BIG_DATA/dataset}:/data:ro
      - ./submission:/app/artifacts/final/submission
    command: ["submit", "${SUBMIT_CONFIG:-configs/final_model.yaml}"]  # entrypoint.sh: mode, then the config
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
